name: Exportar planilha

on:
  workflow_dispatch:
    inputs:
      tipo:
        description: 'rede'
        required: true
        default: 'rede'
      grupo:
        description: 'Operadora (ex.: Unimed). Vazio = todas'
        required: false
        default: ''

concurrency:
  group: exportar-planilha
  cancel-in-progress: false

jobs:
  exportar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Gerar planilha
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GRUPO: ${{ github.event.inputs.grupo }}
        run: node src/exportar-${{ github.event.inputs.tipo }}.js
      - uses: actions/upload-artifact@v4
        with:
          name: planilha
          path: saida/*.xlsx
          retention-days: 3
