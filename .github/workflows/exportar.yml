name: Exportar planilha

on:
  workflow_dispatch:
    inputs:
      tipo:
        description: 'rede ou precos'
        required: true
        default: 'rede'
      grupo:
        description: 'Operadora (ex.: Unimed). Vazio = todas'
        required: false
        default: ''
      admin:
        description: 'só precos: vazio (todas), direto ou __administradoras__'
        required: false
        default: ''

concurrency:
  group: exportar-planilha
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  exportar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Gerar planilha
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GRUPO: ${{ github.event.inputs.grupo }}
          ADMIN: ${{ github.event.inputs.admin }}
        run: |
          if [ "${{ github.event.inputs.tipo }}" = "precos" ]; then
            cd site && npm ci --no-audit --no-fund
            npx -y esbuild scripts/exportar-precos.mjs --bundle --platform=node --format=esm --conditions=react-server --packages=external --outfile=scripts/.exp.mjs --log-level=warning
            SAIDA=../saida node --conditions=react-server scripts/.exp.mjs
          else
            node src/exportar-${{ github.event.inputs.tipo }}.js
          fi
      - name: Enviar para o armazenamento privado
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node src/enviar-exportacao.js
