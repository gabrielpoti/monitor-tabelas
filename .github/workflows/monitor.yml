name: Monitor de Tabelas

on:
  schedule:
    - cron: '17 6 * * *'     # todo dia 03:17 (Brasília): preços, coparticipação e carência
    - cron: '43 2 * * 0,3'   # sáb e ter 23:43 (Brasília): cidades + área de comercialização
    - cron: '29 9 * * 2,5'   # ter e sex 06:29 (Brasília): rede credenciada (ciclo de 90 dias, retoma de onde parou)
    - cron: '47 9 * * 1'     # segunda 06:47 (Brasília): desconto por quantidade de vidas
  workflow_dispatch:
    inputs:
      modo:
        description: 'diario, semanal, rede, descontos, regras, prioridade, cidades, area ou teste'
        required: true
        default: 'teste'
      grupo:
        description: 'modo prioridade (obrigatório) ou regras (opcional): Hapvida, Hapvida Clinipam, NotreDame, Amil, Bradesco Saúde, SulAmérica ou Unimed'
        required: false
        default: ''

concurrency:
  group: monitor-tabelas
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rodar
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GRUPO: ${{ github.event.inputs.grupo }}
        run: |
          MODO="${{ github.event.inputs.modo }}"
          if [ -z "$MODO" ]; then
            case "${{ github.event.schedule }}" in
              "17 6 * * *") MODO=diario ;;
              "29 9 * * 2,5") MODO=rede ;;
              "47 9 * * 1") MODO=descontos ;;
              *) MODO=semanal ;;
            esac
          fi
          echo "Modo: $MODO"
          node src/index.js "$MODO"
